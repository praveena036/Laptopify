services:
  - type: web
    name: laptopify-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: laptopify-postgres
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: laptopify-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: EMAIL_PROVIDER
        value: resend
      - key: CONTACT_EMAIL_TO
        value: cherishbywedknotcraft@gmail.com

databases:
  - name: laptopify-postgres
    region: singapore
    plan: free
    databaseName: laptopify
    user: laptopify
